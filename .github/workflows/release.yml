name: Release Chinese edition

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish DMG
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          REF: ${{ github.ref_name }}
        run: |
          VERSION="${REF#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build .app and DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./package.sh --dmg

      - name: Verify and upload build artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ls -la "Pomodoro-${VERSION}.dmg"
          du -h "Pomodoro-${VERSION}.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pomodoro-DMG
          path: Pomodoro-${{ steps.version.outputs.version }}.dmg

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Pomodoro-${VERSION}.dmg" \
            --title "番茄钟 ${VERSION}" \
            --notes "简体中文定制版：主界面、菜单、通知与语音提醒均已汉化。"
